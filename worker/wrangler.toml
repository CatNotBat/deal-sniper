name = "deal-sniper"
main = "src/index.ts"
compatibility_date = "2026-06-28"
preview_urls = false

# Secrets (set via `wrangler secret put <NAME>`):
# EBAY_CLIENT_ID          - eBay app Client ID
# EBAY_CLIENT_SECRET      - eBay app Client Secret (Cert ID)
# ANTHROPIC_API_KEY       - Anthropic API key
# AUTH_TOKEN              - shared secret for bookmarklet auth (generate with: openssl rand -hex 32)
# EBAY_VERIFICATION_TOKEN - token for eBay account deletion notification verification
